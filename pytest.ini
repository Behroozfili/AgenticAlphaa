[pytest]

pythonpath = .

# The default suite is deliberately local/offline. Integration tests are
# inventoried and collected explicitly because several unmarked legacy tests
# perform real Yahoo/SEC/news calls. They must never run by accident.
testpaths = tests/unit_tests
addopts = -p no:langsmith_plugin -m "not live"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    asyncio: mark a test as an asynchronous test
    unit: deterministic local unit test with external I/O mocked or disabled
    integration: component or end-to-end integration test
    live: requires network, external APIs, external databases, or paid services (disabled by default)
    backtest: historical point-in-time or walk-forward backtest
    slow: mark test as slow
