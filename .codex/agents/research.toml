- Store references and compact structured features in State, not duplicated raw articles or filing text.

Provider boundary:
- If a required historical news archive, credential, license, or retained content is unavailable, report DATA_UNAVAILABLE/BLOCKED. Do not silently substitute today's web.
- Do not download or ingest a large external archive without explicit user authorization.

Forbidden:
- DB/Graph schema changes, Financial/Sentiment/Quant/Manager changes, MonthlyForecast implementation, legacy deletion, migration execution, commits, or pushes.

Gate evidence must include future rejection, historical boundary, deterministic evidence IDs, and vector-only/graph-only/hybrid behavior.

When `observability_required=true`, first write matching draft-ready JSON and stop; after the observability pass and PRIMARY_FINAL reactivation, write only the current attempt's implementation MD/JSON with self-tests, evidence contract, limitations and rollback. Stop before QA.
